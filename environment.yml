# SymADiT environment
# Python 3.10, PyTorch 2.4.1, CUDA 12.4

name: symadit

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # PyTorch and CUDA
  - pytorch=2.4.1
  - pytorch-cuda=12.4

  # Scientific computing
  - numpy=2.0.1
  - pandas=2.2.3
  - scipy=1.15.3
  - scikit-learn=1.6.1
  - matplotlib-base=3.10.1

  # Materials science
  - ase=3.24.0
  - pymatgen=2025.3.10
  - pyxtal=1.1.3
  - spglib=2.6.0

  # Configuration and utilities
  - hydra-core=1.3.2
  - hydra-colorlog=1.2.0
  - joblib=1.4.2
  - tqdm=4.67.1
  - wandb=0.26.1

  # Pip dependencies
  - pip:
      - lightning==2.6.4
      - torch-geometric==2.7.0
      - torchdiffeq==0.2.5
      - rootutils==1.0.7
      - smact==3.1.0
      - p-tqdm==1.4.2
      - rich==14.0.0