_target_: src.models.ldm_module.LatentDiffusionLitModule

# path to VAE checkpoint
# empty string means no VAE is used, and we create a random init one
autoencoder_ckpt: ""

# loss for vectors
x_loss: l2 # [l2, l1, smooth_l1]

denoiser:
  _target_: src.models.denoisers.dit.DiT
  d_x: 8
  d_model: 768    # 384, 768, 1024
  nhead: 12        # 6, 12, 16
  num_layers: 12  # 12, 12, 24

interpolant:
  _target_: src.models.interpolants.flow_matching.FlowMatchingInterpolant
  min_t: 1e-2
  corrupt: True
  num_timesteps: 500
  self_condition: true
  self_condition_prob: 0.5


sampling:
  cfg_scale: 2.0
  num_samples: 1000
  batch_size: 100
  data_dir: ${paths.data_dir}
  visualize: false
  save_dir: ${paths.output_dir}
  add_noise_when_sampling: false
  temperature:
    wyckoff: 1.6
    atom_type: 1.2




conditioning:
  allowed_spacegroups: null # Which space groups we want to condition on when doing generation! (also train????)
  forbidden_spacegroups: null

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0

scheduler: null

scheduler_frequency: ${trainer.check_val_every_n_epoch}

novelty:
  compute_novelty: true
  data_dir: ${paths.data_dir}
  use_all_data: ${use_all_data}



# compile model for faster training with pytorch 2.0
compile: false

debug: ${debug} 


