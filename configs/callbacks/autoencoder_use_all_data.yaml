defaults:
  - model_checkpoint
  # - early_stopping
  # - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "vae-epoch@{epoch}-train_loss@{train/loss:.4f}"


  save_top_k: -1
  save_last: True

  save_on_train_epoch_end: true
  every_n_epochs: 250

early_stopping:
  monitor: "train/loss"
  patience: 100
  mode: "min"
